services:
  internship-phishing-simulation:
    build:
      context: ./demos/internship-phishing-simulation
      dockerfile: Dockerfile
    image: cybersanket/internship-phishing-simulation:latest
    container_name: cybersanket-phishing-demo
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
